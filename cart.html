<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyKart - Cart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <header>
      <nav>
        <a href="index.html" class="logo">
          <div class="logo-icon">🎤</div>
          <div class="logo-text">
            <h1>EasyKart</h1>
            <p>VOICE FIRST</p>
          </div>
        </a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="categories.html">Categories</a>
          <a href="products.html">Products</a>
          <a href="cart.html" class="active">Cart</a>
          <a href="help.html">Help</a>
        </div>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
      <h2 class="cart-title">Your Shopping Cart</h2>
      <p id="cartStatus" role="status"></p>

      <div class="cart-layout">
        <!-- Cart Items -->
        <section class="cart-list" id="cartItems">
          <!-- Populated from the saved cart by script.js. -->
        </section>

        <!-- Sidebar -->
        <aside class="cart-sidebar">
          <div class="summary-card">
            <h3>Order Summary</h3>

            <!-- Subtotal -->
            <div class="summary-line">
              <span>Items Subtotal</span>
              <strong id="subtotal">₹0</strong>
            </div>

            <!-- Delivery Charge -->
            <div class="summary-line">
              <span>Home Delivery</span>
              <strong id="deliveryFee">₹0</strong>
            </div>

            <div class="summary-divider"></div>

            <!-- Total Price -->
            <div class="total-line">
              <span>Grand Total</span>
              <span class="total-price" id="totalPrice">₹0</span>
            </div>

            <!-- Checkout Button -->
            <button class="btn-primary" type="button" onclick="checkout()">
              Review Order (Demo)
            </button>

            <!-- Clear Cart Button -->
            <button
              class="btn-orange"
              type="button"
              onclick="clearCart()"
              style="margin-top: 10px"
            >
              Clear Cart
            </button>
          </div>
          <!-- Need Help -->
          <div class="help-card">
            <h4>📞 Need Help?</h4>
            <p class="help-sub">Submit a help request.</p>
            <p class="help-desc">
              Use the Help page to save a question about your order or sizing.
            </p>
            <a class="btn-orange" href="help.html">Request Help</a>
          </div>
        </aside>
      </div>
    </main>
    <!-- JavaScript copies this template once for each saved product. -->
    <template id="cartTemplate">
      <article class="cart-item">
        <span class="item-num"></span>
        <img alt="">
        <div class="item-details"><h4></h4><p></p></div>
        <div class="qty-control">
          <button type="button">−</button><span></span><button type="button">+</button>
        </div>
        <span class="item-price"></span>
      </article>
    </template>
    <script src="script.js"></script>
  </body>
</html>
