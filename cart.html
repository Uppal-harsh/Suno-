  <section id="cart">

    <h2>Your Cart</h2>

    <div id="cartItems">

        <p class="empty-cart">
            Your cart is empty.
        </p>

    </div>

    <div class="cart-summary">

        <div>
            <span>Subtotal</span>
            <strong id="cartSubtotal">₹0</strong>
        </div>

        <div>
            <span>Delivery</span>
            <strong id="deliveryCharge">₹0</strong>
        </div>

        <div>
            <span>Total</span>
            <strong id="cartTotal">₹0</strong>
        </div>

        <button id="checkoutButton" type="button">
            Proceed to Checkout
        </button>

    </div>

</section>
