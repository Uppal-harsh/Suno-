<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyKart - Categories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav>
      <a href="index.html" class="logo">

        <div class="logo-text">
          <h1>EasyKart</h1>
          <p>VOICE FIRST</p>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="categories.html" class="active">Categories</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="help.html">Help</a>

    <h2 class="page-title">Categories</h2>

    <div class="grid-4">
      <!-- Category 1 -->
      <div class="card">
        <div class="img-wrap">
          <span class="badge-num">1</span>

        <div class="card-meta">
          <h4>Clothing</h4>

        <a href="products.html" class="btn-orange">Open</a>
      </div>

      <!-- Category 2 -->
      <div class="card">
        <div class="img-wrap">
          <span class="badge-num">2</span>

      <!-- Category 3 -->
      <div class="card">

          <span class="count">12 categories</span>

      </div>

      <!-- Category 4 -->
      <div class="card">
        <div class="img-wrap">
          <span class="badge-num">4</span>
          <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400&auto=format&fit=crop&q=80" alt="Accessories">
        </div>
        <div class="card-meta">
          <h4>Accessories</h4>
          <span class="count">12 categories</span>
        </div>
        <a href="products.html" class="btn-orange">Open</a>
      </div>
    </div>
