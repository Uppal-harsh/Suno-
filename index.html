<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyKart - Voice Shopping for Everyone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. HEADER -->
  <header class="main-header">
    <div class="logo">EasyKart</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#categories">Categories</a>
      <a href="#cart">Cart</a>
      <a href="#help">Help</a>
    </nav>
    <button class="voice-btn" id="voiceAssistantBtn" aria-label="Talk to Assistant">
      🎙️ Talk to Assistant
    </button>
  </header>

  <!-- 2. HERO SECTION -->
  <section class="hero">
    <h1>Namaste! What would you like to order today?</h1>
    <p>Tap the microphone and just speak — we'll do the rest.</p>
    <button class="mic-button" id="micButton" aria-label="Start voice chat">
      🎤
    </button>
    <p id="voiceStatus">Listening... </p>
  </section>

  <!-- 3. AI CHAT BOX -->
  <section class="ai-chat-box" id="chatBox">
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">Hello! I'm your shopping assistant. What do you need?</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="textInput" placeholder="Or type here...">
      <button id="sendBtn">Send</button>
    </div>
  </section>

  <!-- 4. CATEGORIES SECTION -->
  <section id="categories" class="categories">
    <h2>Shop by Category</h2>
    <div class="category-grid">
      <button class="category-card">🥦 Vegetables</button>
      <button class="category-card">💊 Medicines</button>
      <button class="category-card">🥛 Dairy</button>
      <button class="category-card">🧴 Personal Care</button>
    </div>
  </section>

  <!-- 5. PRODUCTS SECTION -->
  <section id="products" class="product-list">
    <h2>Available Items</h2>
    <div class="product-grid" id="productGrid">
      <article class="product-card">
        <img src="tomato.jpg" alt="Fresh Tomatoes">
        <h3>Tomatoes</h3>
        <p>₹30/kg</p>
        <button class="add-cart-btn">Add to Cart</button>
      </article>
    </div>
 <section id="cart" class="cart-section">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <p>Total: ₹<span id="cartTotal">0</span></p>
  <button id="checkoutBtn">Proceed to Checkout</button>
</section>
</body>
</html>
