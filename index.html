<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyKart - Voice Shopping for Everyone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- All sections go here -->
   <header class="main-header">
  <div class="logo">EasyKart</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#categories">Categories</a>
    <a href="#cart">Cart</a>
    <a href="#help">Help</a>
  </nav>
  <button class="voice-btn" id="voiceAssistantBtn" aria-label="Talk to Assistant">
    🎙️ Talk to Assistant
    <section class="hero">
  <h1>Namaste! What would you like to order today?</h1>
  <p>Tap the microphone and just speak — we'll do the rest.</p>
  <button class="mic-button" id="micButton" aria-label="Start voice chat">
    🎤
  </button>
  <p id="voiceStatus">Listening... </p>
</section><section class="ai-chat-box" id="chatBox">
  <div class="chat-messages" id="chatMessages">
    <!-- Messages get added here dynamically -->
    <div class="message assistant">Hello! I'm your shopping assistant. What do you need?</div>
  </div>
  <div class="chat-input-row">
    <input type="text" id="textInput" placeholder="Or type here...">
    <button id="sendBtn">Send</button>
  </div>
</section>
  </button>
</header>
</body>
</html>
