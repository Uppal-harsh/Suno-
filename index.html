<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyKart - Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav>
      <a href="index.html" class="logo">
        <div class="logo-icon">🎤</div>
        <div class="logo-text">
          <h1>EasyKart</h1>
          <p>VOICE FIRST</p>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="categories.html">Categories</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="help.html">Help</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container">
    <div class="home-grid">
      <!-- Voice Search Center -->
      <section class="hero">
        <h2>Namaste!</h2>
        <h3>What would you like to order today?</h3>
        <span class="hint">PRESS SPEAKER TO START</span>

        <button class="mic-btn" aria-label="Mic">🎤</button>
        <p class="listening-text">• Listening...</p>

        <div class="wave-bars">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <!-- Assistant Widget -->
      <aside class="chat-card">
        <div class="chat-header">
          <div class="avatar">🎤</div>
          <div>
            <h4>EasyKart Assistant</h4>
            <p>● Online • Ready to help</p>
          </div>
        </div>
        <div class="chat-body">
          <div class="chat-msg">
            Hello! I'm your shopping assistant. What do you need?
            <small>Try: "Show me black shirts under ₹1000"</small>
          </div>
        </div>
        <div class="chat-footer">
          <input type="text" placeholder="Or type here...">
          <button type="button">Send</button>
        </div>
      </aside>
    </div>
  </main>

</body>
</html>
