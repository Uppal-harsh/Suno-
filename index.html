<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=.0">
  <title>EasyKart - Voice Shopping for Everyone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. HEADER -->
  <header>
    <nav>

        <div class="logo">
          <div class="logo-mic">🎤</div>
          <div class="logo-text">
            <h1>EasyKart</h1>
            <p>VOICE FIRST</p>
          </div>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="help.html">Help</a>
        </div>
        <div class="nav-actions">
            <button type="button">👤 Account</button>
            <button type="button">🛒 Cart</button>
        </div>
    </nav>
</header>


  <!-- 2. HERO SECTION -->
  <section class="hero">
    <h1>Namaste! What would you like to order today?</h1>
    <p>Tap the microphone and just speak — we'll do the rest.</p>
    <button class="mic-button" id="micButton" aria-label="Start voice chat">
      🎤
    </button>
    <p id="voiceStatus">Listening... </p>
  </section>

  <!-- 3. AI CHAT BOX -->
  <section class="ai-chat-box" id="chatBox">
    <div class="chat-messages" id="chatMessages">
      <div class="message assistant">Hello! I'm your shopping assistant. What do you need?</div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="textInput" placeholder="Or type here...">
      <button id="sendBtn">Send</button>
    </div>
  </section>

  <!-- 4. FOOTER -->
  <footer>
    <p>EasyKart</p>
  </footer>
</body>
</html>
