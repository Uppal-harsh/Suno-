<!DOCTYPE html>

<head>

  <title>EasyKart - Help & Support</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <nav>
      <a href="index.html" class="logo">
        <div class="logo-mic">
          <svg class="mic-icon-svg" style="width: 20px; height: 20px;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>

        <div class="logo-text">
          <h1>EasyKart</h1>
          <p>VOICE FIRST</p>
        </div>
      </a>

      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="help.html" class="active">Help</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="page-container">
    <div class="help-page-container">
      <div class="help-card" style="padding: 32px 24px;">
        <div class="help-card-header" style="justify-content: center; margin-bottom: 12px;">
          <div class="help-icon" style="width: 36px; height: 36px; font-size: 16px;">
            <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="currentColor">

        </div>

        <p class="help-desc" style="font-size: 13px; margin-bottom: 24px; max-width: 420px; margin-left: auto; margin-right: auto;">Our customer assistants are available 24/7 to help you browse items, place orders, answer questions, or handle returns over the phone.</p>
        <button class="btn-talk-human" style="max-width: 280px; margin: 0 auto; display: block; padding: 14px;" type="button">Talk to a Human</button>
