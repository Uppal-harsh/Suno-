<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyKart - Help</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <nav>
      <a href="index.html" class="logo">
        <div class="logo-icon">🎤</div>
        <div class="logo-text">
          <h1>EasyKart</h1>
          <p>VOICE FIRST</p>
        </div>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="help.html" class="active">Help</a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="container">
    <section class="help-card contact-card">
      <h2>Request Help</h2>
      <p>Submit a question about products, sizing or your cart.</p>
      <div id="serverNotice" class="server-notice" hidden>
        <p>This preview cannot save requests. Run <code>python3 server.py</code> in the VS Code terminal, then open the working form below.</p>
        <a href="http://127.0.0.1:8000/help.html">Open the working Help form →</a>
      </div>
      <form id="helpForm" class="help-form">
        <label for="customerName">Name</label>
        <input id="customerName" name="name" required minlength="2" maxlength="80" autocomplete="name">
        <label for="customerEmail">Email</label>
        <input id="customerEmail" name="email" type="email" required maxlength="120" autocomplete="email">
        <label for="customerMessage">Message</label>
        <textarea id="customerMessage" name="message" required minlength="10" maxlength="1000" rows="4"></textarea>
        <button class="btn-orange" type="submit">Submit Request</button>
        <p id="formStatus" role="status"></p>
      </form>
    </section>
  </main>
   <script src="script.js"></script>
</body>
</html>
